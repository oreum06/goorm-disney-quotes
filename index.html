<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>디즈니 명언 | Twilight Quotes</title>
  <meta name="description" content="디즈니 명언을 감성적인 카드로 감상하고 저장하는 앱" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600;1,700&family=JetBrains+Mono:wght@400;500;700&display=swap"
  />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
  />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/theme-language.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <div class="splash" id="splash">
    <div class="splash-logo">Twilight Quotes</div>
    <div class="splash-sub" data-i18n="splashSub">오늘의 명언을 준비하고 있어요</div>
  </div>

  <div class="bg-photo-stage" aria-hidden="true">
    <img id="bg-photo-a" class="bg-photo" alt="" />
    <img id="bg-photo-b" class="bg-photo" alt="" />
    <div class="bg-scrim"></div>
  </div>

  <div class="app">
    <header class="app-header">
      <div class="top-controls" aria-label="앱 설정">
        <button type="button" class="header-icon-btn" id="btn-language" aria-label="Switch language"></button>
        <button type="button" class="header-icon-btn" id="btn-theme" aria-label="Toggle theme"></button>
      </div>

      <button type="button" class="app-title-button" id="btn-home-title" aria-label="Go home">
        <h1 class="app-title">Twilight Quotes</h1>
      </button>
      <p class="app-subtitle" data-i18n="subtitle">디즈니 명언 카드</p>
    </header>

    <main class="app-main">
      <section id="view-home" class="view view-home" data-view="home">
        <div class="chips" id="category-chips"></div>

        <div class="card-stage">
          <button class="nav-arrow nav-arrow-prev" id="btn-prev" aria-label="이전 명언"></button>
          <div class="card-frame" id="card-frame">
            <div id="card-mount" class="card-mount"></div>
          </div>
          <button class="nav-arrow nav-arrow-next" id="btn-next" aria-label="다음 명언"></button>
        </div>

        <div class="progress-dots" id="progress-dots"></div>

        <div class="action-bar">
          <button type="button" class="action-btn" id="btn-like" aria-label="좋아요" aria-pressed="false"></button>
          <button type="button" class="action-btn" id="btn-copy" aria-label="텍스트 복사"></button>
          <button type="button" class="action-btn" id="btn-download" aria-label="이미지로 저장"></button>
        </div>
      </section>

      <section id="view-collection" class="view view-collection" data-view="collection" hidden>
        <h2 class="view-title"><span data-i18n="collectionTitle">저장한 명언</span><span class="count" id="collection-count"></span></h2>
        <div class="collection-grid" id="collection-mount"></div>
        <p class="empty-state" id="collection-empty" hidden></p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="화면 전환">
      <button class="nav-btn is-active" data-target="home" data-icon="home"><span data-i18n="navHome">홈</span></button>
      <button class="nav-btn" data-target="collection" data-icon="bookmark"><span data-i18n="navSaved">보관함</span></button>
    </nav>
  </div>

  <div class="export-template" id="export-template" aria-hidden="true">
    <img id="export-bg" class="export-bg" alt="" />
    <div class="export-overlay"></div>
    <p class="export-quote" id="export-quote"></p>
    <p class="export-translation" id="export-translation"></p>
    <p class="export-source" id="export-source"></p>
    <p class="export-brand">Twilight Quotes</p>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/data-v2.js"></script>
  <script src="js/background-v2.js"></script>
  <script src="js/render-v2.js"></script>
  <script src="js/app-v2.js"></script>
</body>
</html>
